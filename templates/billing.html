{% extends "base.html" %}{% block content %}<h1>Create Bill</h1><form method="post" class="card" id="billform"><p class="muted">Add one or more products. Stock is deducted after successful billing.</p>
<div id="items"><div class="billrow"><select name="product_id[]" required><option value="">Select product</option>{% for p in products %}<option value="{{p.product_id}}">{{p.name}} · ₹{{'%.2f'|format(p.unit_price)}} · stock {{p.stock_qty}}</option>{% endfor %}</select><input type="number" name="quantity[]" min="1" value="1" required><button type="button" class="danger small" onclick="this.parentElement.remove()">Remove</button></div></div>
<button type="button" class="secondary" onclick="addRow()">+ Add item</button><label class="discount">Discount (₹)<input type="number" name="discount" min="0" step=".01" value="0"></label><button>Create Bill</button></form>
<script>function addRow(){let first=document.querySelector('.billrow');let row=first.cloneNode(true);row.querySelector('select').value='';row.querySelector('input').value=1;document.getElementById('items').appendChild(row)}</script>{% endblock %}
